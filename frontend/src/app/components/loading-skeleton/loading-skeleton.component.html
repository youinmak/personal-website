<div class="animate-pulse" [ngSwitch]="type">

  <!-- Profile Skeleton -->
  <div *ngSwitchCase="'profile'" class="mb-12">
    <div class="h-10 bg-slate-200 dark:bg-slate-700 rounded w-3/4 mb-4"></div>
    <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-1/2 mb-8"></div>
    
    <div class="space-y-4">
      <div class="flex items-center"><div class="w-4 h-4 bg-slate-200 dark:bg-slate-700 rounded-full mr-3"></div><div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-1/2"></div></div>
      <div class="flex items-center"><div class="w-4 h-4 bg-slate-200 dark:bg-slate-700 rounded-full mr-3"></div><div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-5/12"></div></div>
      <div class="flex items-center"><div class="w-4 h-4 bg-slate-200 dark:bg-slate-700 rounded-full mr-3"></div><div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-2/3"></div></div>
    </div>

    <div class="mt-8 flex flex-wrap gap-4">
      <div class="w-16 h-6 bg-slate-200 dark:bg-slate-700 rounded-md"></div>
      <div class="w-16 h-6 bg-slate-200 dark:bg-slate-700 rounded-md"></div>
      <div class="w-16 h-6 bg-slate-200 dark:bg-slate-700 rounded-md"></div>
    </div>
  </div>

  <!-- Skills Skeleton -->
  <div *ngSwitchCase="'skills'" class="mb-12">
    <h2 class="text-xs font-black uppercase tracking-[0.2em] text-slate-400 mb-6">Expertise</h2>
    <div class="flex flex-wrap gap-2">
      <div class="w-20 h-6 bg-slate-200 dark:bg-slate-700 rounded"></div>
      <div class="w-24 h-6 bg-slate-200 dark:bg-slate-700 rounded"></div>
      <div class="w-16 h-6 bg-slate-200 dark:bg-slate-700 rounded"></div>
      <div class="w-28 h-6 bg-slate-200 dark:bg-slate-700 rounded"></div>
      <div class="w-20 h-6 bg-slate-200 dark:bg-slate-700 rounded"></div>
    </div>
  </div>

  <!-- Tools Skeleton -->
  <div *ngSwitchCase="'tools'" class="mb-12">
    <h2 class="text-xs font-black uppercase tracking-[0.2em] text-slate-400 mb-6">Tools</h2>
    <div class="grid grid-cols-2 gap-y-3 gap-x-4">
      <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-3/4"></div>
      <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-5/6"></div>
      <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-2/3"></div>
      <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-3/4"></div>
      <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-5/6"></div>
      <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-1/2"></div>
    </div>
  </div>

  <!-- Languages Skeleton -->
  <div *ngSwitchCase="'languages'" class="mb-12">
    <h2 class="text-xs font-black uppercase tracking-[0.2em] text-slate-400 mb-6">Languages</h2>
    <div class="space-y-4">
      <div class="flex justify-between items-center"><div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-1/3"></div><div class="h-3 bg-slate-200 dark:bg-slate-700 rounded w-1/4"></div></div>
      <div class="flex justify-between items-center"><div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-1/4"></div><div class="h-3 bg-slate-200 dark:bg-slate-700 rounded w-1/3"></div></div>
      <div class="flex justify-between items-center"><div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-1/3"></div><div class="h-3 bg-slate-200 dark:bg-slate-700 rounded w-1/5"></div></div>
    </div>
  </div>

  <!-- Text Block Skeleton (e.g. Profile Summary) -->
  <div *ngSwitchCase="'text-block'">
    <h2 class="text-2xl font-black mb-6 flex items-center">
      <span class="w-8 h-1 bg-slate-200 dark:bg-slate-700 mr-4"></span>
      <div class="h-6 bg-slate-200 dark:bg-slate-700 rounded w-32"></div>
    </h2>
    <div class="space-y-3">
      <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-full"></div>
      <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-full"></div>
      <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-5/6"></div>
    </div>
  </div>

  <!-- Experience Skeleton -->
  <div *ngSwitchCase="'experience'">
    <h2 class="text-2xl font-black mb-8 flex items-center">
      <span class="w-8 h-1 bg-slate-200 dark:bg-slate-700 mr-4"></span>
      <div class="h-6 bg-slate-200 dark:bg-slate-700 rounded w-40"></div>
    </h2>
    <div class="space-y-12">
      <div *ngFor="let i of [1, 2]">
        <div class="flex justify-between mb-4">
          <div class="h-6 bg-slate-200 dark:bg-slate-700 rounded w-1/3"></div>
          <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-1/4"></div>
        </div>
        <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-1/2 mb-4"></div>
        <div class="space-y-2">
          <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-full"></div>
          <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-4/5"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Projects Skeleton -->
  <div *ngSwitchCase="'projects'">
    <h2 class="text-2xl font-black mb-8 flex items-center">
      <span class="w-8 h-1 bg-slate-200 dark:bg-slate-700 mr-4"></span>
      <div class="h-6 bg-slate-200 dark:bg-slate-700 rounded w-32"></div>
    </h2>
    <div class="grid gap-8">
      <div *ngFor="let i of [1, 2]" class="p-6 rounded-2xl bg-slate-50 dark:bg-slate-800/30 border border-slate-200 dark:border-slate-800">
        <div class="h-5 bg-slate-200 dark:bg-slate-700 rounded w-1/3 mb-4"></div>
        <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-full mb-2"></div>
        <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-2/3 mb-4"></div>
        <div class="flex gap-2">
          <div class="w-12 h-4 bg-slate-200 dark:bg-slate-700 rounded"></div>
          <div class="w-16 h-4 bg-slate-200 dark:bg-slate-700 rounded"></div>
          <div class="w-14 h-4 bg-slate-200 dark:bg-slate-700 rounded"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Expertise Grid Skeleton -->
  <div *ngSwitchCase="'expertise'">
    <h2 class="text-2xl font-black mb-8 flex items-center">
      <span class="w-8 h-1 bg-slate-200 dark:bg-slate-700 mr-4"></span>
      <div class="h-6 bg-slate-200 dark:bg-slate-700 rounded w-32"></div>
    </h2>
    <div class="grid gap-6 md:grid-cols-2">
      <div *ngFor="let i of [1, 2, 3, 4]" class="p-5 rounded-2xl bg-slate-50 dark:bg-slate-800/30 border border-slate-200 dark:border-slate-800">
        <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-1/3 mb-4"></div>
        <div class="flex flex-wrap gap-2">
          <div class="w-16 h-6 bg-slate-200 dark:bg-slate-700 rounded-full"></div>
          <div class="w-20 h-6 bg-slate-200 dark:bg-slate-700 rounded-full"></div>
          <div class="w-14 h-6 bg-slate-200 dark:bg-slate-700 rounded-full"></div>
          <div class="w-18 h-6 bg-slate-200 dark:bg-slate-700 rounded-full"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Certifications Skeleton -->
  <div *ngSwitchCase="'certifications'">
    <h2 class="text-2xl font-black mb-8 flex items-center">
      <span class="w-8 h-1 bg-slate-200 dark:bg-slate-700 mr-4"></span>
      <div class="h-6 bg-slate-200 dark:bg-slate-700 rounded w-48"></div>
    </h2>
    <div class="grid gap-4 sm:grid-cols-2">
      <div *ngFor="let i of [1, 2, 3, 4]" class="p-4 rounded-xl border border-slate-100 dark:border-slate-800 bg-white dark:bg-slate-900/50 flex items-start gap-4">
        <div class="p-2 rounded-lg bg-slate-200 dark:bg-slate-700 w-10 h-10"></div>
        <div class="flex-1 space-y-2">
          <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-3/4"></div>
          <div class="h-3 bg-slate-200 dark:bg-slate-700 rounded w-1/2"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Hobbies Skeleton -->
  <div *ngSwitchCase="'hobbies'">
    <h2 class="text-2xl font-black mb-8 flex items-center">
      <span class="w-8 h-1 bg-slate-200 dark:bg-slate-700 mr-4"></span>
      <div class="h-6 bg-slate-200 dark:bg-slate-700 rounded w-32"></div>
    </h2>
    <div class="flex flex-wrap gap-4">
      <div *ngFor="let i of [1, 2, 3]" class="px-6 py-4 rounded-xl w-40 bg-slate-50 dark:bg-slate-800/30 border border-slate-200 dark:border-slate-800">
        <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-3/4 mb-2"></div>
        <div class="h-3 bg-slate-200 dark:bg-slate-700 rounded w-full"></div>
      </div>
    </div>
  </div>

  <!-- Cover Letter Skeleton -->
  <div *ngSwitchCase="'cover-letter'">
    <h2 class="text-2xl font-black mb-10 flex items-center">
      <span class="w-8 h-1 bg-slate-200 dark:bg-slate-700 mr-4"></span>
      <div class="h-6 bg-slate-200 dark:bg-slate-700 rounded w-40"></div>
    </h2>
    
    <div class="space-y-8">
      <div class="space-y-2">
        <div class="h-3 bg-slate-200 dark:bg-slate-700 rounded w-24"></div>
        <div class="pt-4 space-y-2">
          <div class="h-5 bg-slate-200 dark:bg-slate-700 rounded w-48"></div>
          <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-32"></div>
          <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-40"></div>
        </div>
      </div>

      <div class="py-4 border-y border-slate-100 dark:border-slate-800">
        <div class="h-6 bg-slate-200 dark:bg-slate-700 rounded w-3/4"></div>
      </div>

      <div class="space-y-6">
        <div class="space-y-2">
          <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-full"></div>
          <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-full"></div>
          <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-5/6"></div>
        </div>
        <div class="space-y-2">
          <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-full"></div>
          <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-11/12"></div>
        </div>
      </div>

      <div class="pt-8">
        <div class="h-3 bg-slate-200 dark:bg-slate-700 rounded w-20 mb-2"></div>
        <div class="h-8 bg-slate-200 dark:bg-slate-700 rounded w-48"></div>
      </div>
    </div>
  </div>

</div>
