<div [class.dark]="isDarkMode">
  <div class="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-300 font-sans">
    
    <!-- Floating Action Buttons -->
    <div class="fixed top-6 right-6 z-50 flex gap-4">
      <!-- Download PDF Button -->
      <button (click)="downloadPDF()" [disabled]="isGeneratingPdf" class="p-3 rounded-full bg-blue-600 text-white shadow-lg hover:scale-110 transition-transform disabled:opacity-50 disabled:hover:scale-100 flex items-center justify-center w-12 h-12" title="Download as PDF">
        <span *ngIf="!isGeneratingPdf">📄</span>
        <svg *ngIf="isGeneratingPdf" class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
      </button>

      <!-- Theme Toggle -->
      <button (click)="toggleDarkMode()" class="p-3 rounded-full bg-white dark:bg-slate-800 shadow-lg border border-slate-200 dark:border-slate-700 hover:scale-110 transition-transform w-12 h-12">
        <span *ngIf="!isDarkMode">🌙</span>
        <span *ngIf="isDarkMode">☀️</span>
      </button>
    </div>

    <div class="max-w-6xl mx-auto py-12 px-4 sm:px-6 lg:px-8">
      
      <!-- Main Resume Container -->
      <div id="pdf-container" #pdfContainer class="bg-white dark:bg-slate-900 shadow-2xl rounded-3xl overflow-hidden border border-slate-200 dark:border-slate-800 flex flex-col md:flex-row">
        
        <!-- Left Column (Sidebar) -->
        <aside class="w-full md:w-1/3 bg-slate-50 dark:bg-slate-800/50 p-8 md:p-12 border-b md:border-b-0 md:border-r border-slate-200 dark:border-slate-800">
          <app-sidebar [viewMode]="viewMode" (viewModeChange)="viewMode = $event"></app-sidebar>
        </aside>

        <!-- Right Column (Main Content) -->
        <main class="w-full md:w-2/3 p-8 md:p-12 space-y-16">
          <app-resume *ngIf="viewMode === 'resume'"></app-resume>
          <app-cover-letter *ngIf="viewMode === 'cover-letter'"></app-cover-letter>
        </main>

      </div>

      <footer class="mt-12 text-center text-slate-400 text-xs font-bold uppercase tracking-[0.3em]">
        Built with Spring Boot & Angular • {{ today | date:'yyyy' }}
      </footer>

    </div>
  </div>
</div>
