# Production Configuration Profile

# Restrict logging for production performance and security
logging.level.org.springframework.web=WARN
logging.level.com.personalwebsite.backend=INFO

# In production, we expect the CORS_ALLOWED_ORIGINS to be provided by Cloud Run.
# If for some reason it's missing, we fall back to a safe empty string to block all.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
